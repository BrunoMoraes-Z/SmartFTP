name: Release

# Pushing a tag like v0.2.0 (see `just release` / `just publish`) builds the app and
# publishes a GitHub Release. The in-app updater reads the latest release and installs
# `smartftp-windows-x86_64.exe` after checking it against the published `.sha256`.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $crate = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tag -ne "v$crate") { throw "Tag $tag does not match Cargo.toml version $crate. Use 'just release' to bump both." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$crate" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory out, pkg | Out-Null
          Copy-Item target/release/smartftp.exe out/smartftp-windows-x86_64.exe
          (Get-FileHash out/smartftp-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower() | Set-Content out/smartftp-windows-x86_64.exe.sha256 -NoNewline
          Copy-Item target/release/smartftp.exe pkg/smartftp.exe
          Copy-Item README.md pkg/
          if (Test-Path LICENSE) { Copy-Item LICENSE pkg/ }
          Copy-Item themes pkg/themes -Recurse
          Compress-Archive -Path pkg/* -DestinationPath "out/SmartFTP-$v-windows-x86_64.zip"
          Get-ChildItem out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SmartFTP ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/smartftp-windows-x86_64.exe
            out/smartftp-windows-x86_64.exe.sha256
            out/SmartFTP-${{ steps.version.outputs.version }}-windows-x86_64.zip
