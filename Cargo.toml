[package]
name = "smartftp"
version = "0.5.2"
edition = "2024"

[dependencies]
gpui = "0.2.2"
tokio = { version = "1", features = ["full"] }
webpki-roots = "1"
suppaftp = { version = "13", features = ["tokio-rustls-ring"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
russh-sftp = "4"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
unicode-segmentation = "1"
futures = "0.3"
rand = "0.9"
dirs = "6"
sys-locale = "0.3"
self-replace = "1"
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
sha2 = "0.10"

# Saved passwords live in the OS credential store, never in config.json.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# drop target fix for files dragged from archive managers and virtual files (see dragdrop.rs)
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3"
