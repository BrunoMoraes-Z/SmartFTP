[package]
name = "smartftp"
version = "0.4.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
tokio = { version = "1", features = ["full"] }
webpki-roots = "1"
suppaftp = { version = "13", features = ["tokio-rustls-ring"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
unicode-segmentation = "1"
futures = "0.3"
rand = "0.9"
dirs = "6"
sys-locale = "0.3"
self-replace = "1"
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
sha2 = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3"
