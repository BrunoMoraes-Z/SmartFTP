# SmartFTP theme. Copy this file into the themes folder, rename it and edit the colors.
name = "GitHub Light"
appearance = "light"   # "light" or "dark"

[colors]
bg          = "#FFFFFF"   # window background
surface     = "#F6F8FA"   # panels, sidebar
surface2    = "#EFF2F5"   # inputs, raised items
hover       = "#EAEEF2"   # hover / active rows
border      = "#D0D7DE"   # hairlines
ink         = "#1F2328"   # primary text
muted       = "#59636E"   # secondary text
faint       = "#818B98"   # tertiary text, hints
accent      = "#1F883D"   # primary buttons
accent_ink  = "#FFFFFF"   # text on accent
accent_soft = "#0969DA14"   # selection background (with alpha)
signal      = "#0969DA"   # transfer progress, highlights
ok          = "#1A7F37"   # connected / success
warn        = "#9A6700"   # busy / warning
err         = "#CF222E"   # errors, destructive
folder      = "#BF8700"   # folder icons
